<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>WATCHSTORE - Admin Login</title>

    <link rel="stylesheet"
          href="/login.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="logo">
                <i class="fas fa-clock"></i>
                <span>WATCHSTORE</span>
            </div>

            <h1>Admin Login</h1>

            <p class="subtitle">
                Sign in to access the administration panel
            </p>


            <form id="loginForm">

                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <div class="input-wrapper">

                        <i class="fas fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="admin@watchstore.com"
                            required
                        >

                    </div>

                </div>


                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <i class="fas fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                        >
                            <i class="fas fa-eye"></i>
                        </button>

                    </div>

                </div>


                <div
                    id="loginError"
                    class="login-error"
                ></div>


                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >

                    <i class="fas fa-right-to-bracket"></i>

                    Login

                </button>

            </form>


            <a
                href="/"
                class="back-home"
            >

                <i class="fas fa-arrow-left"></i>

                Back to Store

            </a>

        </div>

    </div>


    <script src="/login.js"></script>

</body>

</html>
